<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Pikachu Landing Page</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="left-section">
            <img class="logo" src="/images/pokemon_logo_-removebg-preview.png"alt="Pokemon Logo">
            <div class="content">
                <p class="small-heading">POKEMON GEN I</p>
                <h1>Pikachu</h1>
                <p class="description">
                    Pikachu is an Electric-type Pokémon introduced
                    in Generation I. Pikachu are small, chubby,
                    and incredibly cute mouse-like Pokémon.
                    They are almost completely covered by
                    yellow fur.
                </p>
                <div class="counter">
                    <div class="line"></div>
                    <span>01 / 08</span>
                </div>
            </div>
            <div class="circle"></div>
        </div>
        <div class="right-section">
            <img src="/images/pikachu.png" alt="Pikachu" class="pikachu">
            <div class="menu_icon">
                <div class="line"></div>
                <div class="line"></div>
                <div class="line"></div>
            </div>
            <div class="side-dots">
              <span class="dot active"></span>
              <span class="dot"></span>
              <span class="dot"></span>
              <span class="dot"></span>
            </div>
        </div>
    </div>
</body>
</html>
